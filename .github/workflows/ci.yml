name: UPSC Studio CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "phase17/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and complete test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,dev,charts]"

      - name: Validate JSON configuration
        run: python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('config').rglob('*.json')]"

      - name: Verify production module imports
        run: |
          python -c "from upsc_studio.projects.manager import ProjectManager"
          python -c "from upsc_studio.pipeline.orchestrator import ChapterPipeline"
          python -c "from upsc_studio.agents.runtime import AgentTaskStore, DependencyScheduler"
          python -c "from upsc_studio.agents.supervisor import ExecutiveProducer"

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Run deterministic agent evaluation suite
        run: python -m upsc_studio.agents.evaluate
