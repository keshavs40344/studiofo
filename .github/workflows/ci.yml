name: UPSC Studio CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate JSON configuration
        shell: pwsh
        run: |
          Get-ChildItem -Path config -Filter *.json -Recurse | ForEach-Object {
            Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }
      - name: Run test suite
        run: python -m pytest -q

      - name: Run deterministic agent evaluation suite
        run: python -m upsc_studio.agents.evaluate
