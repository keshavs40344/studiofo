name: UPSC Studio CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio requests beautifulsoup4

      - name: Run Pytest Suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q

      - name: Run 24 Specialist Agents & Runtime Evaluation
        env:
          PYTHONPATH: src
        run: |
          python -m upsc_studio.agents.evaluate
